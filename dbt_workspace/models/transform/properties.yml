version: 2

models:
  - name: dim_patients
    description: "Transformed patient data with standardized data types."

    columns:
      - name: patient_id
        data_type: varchar(20)

      - name: first_name
        data_type: varchar(200)

      - name: last_name
        data_type: varchar(200)

      - name: date_of_birth
        data_type: date

      - name: phone
        data_type: varchar(30)

      - name: zip
        data_type: varchar(15)

      - name: created_date
        data_type: date

  - name: dim_providers
    description: "Transformed provider data with standardized data types and cleaned text fields."

    columns:
      - name: provider_id
        data_type: varchar(20)

      - name: npi
        data_type: varchar(10)

      - name: first_name
        data_type: varchar(200)

      - name: last_name
        data_type: varchar(200)

      - name: specialty
        data_type: varchar(100)

      - name: role
        data_type: varchar(50)

      - name: effective_date
        data_type: date

      - name: location
        data_type: varchar(100)

  - name: fact_referrals
    description: "Transformed referral data with cleaned text fields and standardized dates."

    columns:
      - name: referral_id
        data_type: varchar(20)

      - name: patient_id
        data_type: varchar(20)

      - name: referring_provider_id
        data_type: varchar(20)

      - name: receiving_provider_id
        data_type: varchar(20)

      - name: referral_date
        data_type: date

  - name: fact_appointments
    description: "Transformed appointment data with cleaned text fields and standardized date and timestamp values."

    columns:
      - name: appointment_id
        data_type: varchar(20)

      - name: patient_id
        data_type: varchar(20)

      - name: provider_id
        data_type: varchar(20)

      - name: appointment_date
        data_type: date

      - name: status
        data_type: varchar(30)

      - name: updated_at
        data_type: timestamp